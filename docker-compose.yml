# Produção: `docker compose up --build -d`
#
# Variáveis públicas do Nuxt usam o prefixo NUXT_PUBLIC_ (ver nuxt.config → runtimeConfig.public).
# Backend: DATABASE_URL, PORT (padrão 3001).

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-razconms}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-razconms}'
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    image: razconms-api:prod
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - '${API_PORT:-3001}:3001'
    environment:
      NODE_ENV: production
      PORT: 3001
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-razconms}?schema=public
    env_file:
      - .env

  web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NODE_VERSION: '24.16'
    image: razconms-web:prod
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - '${WEB_PORT:-3000}:3000'
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3000
    env_file:
      - .env

    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:3000/api/health']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  postgres_data:
